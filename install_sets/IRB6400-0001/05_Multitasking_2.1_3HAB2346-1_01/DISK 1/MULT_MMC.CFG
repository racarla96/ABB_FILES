SYS:CFG_1.0::
MMC_TYPE:
-domain_type CAB_TASKS -text_id 30,18  -add_f 1 \
-attributes_id_hook mlttsk_set_current_object -outline_type SYS_OUTLINE \
-outline_inst_name rapid_tasks_outline
RAPID_TASKS_ATTRIBUTE = MMC_ATTRIBUTE:
-attribute_id Name -text_id 30,19 -reconfig -reconfiglevel PGM -present_type SIMPLE \
-change_type TEXTVAR -char_length 16
-attribute_id Prog -text_id 30,20 -reconfig -reconfiglevel PGM -present_type SIMPLE \
-change_type INTEGER
-attribute_id Task_in_forground -text_id 30,21 -reconfig -reconfiglevel PGM -present_type SIMPLE \
-change_type  CHOICE_INSTANCE_BY_METHOD -choice_method mlttsk_get_possible_frgtask  
-attribute_id Type -text_id 30,22 -reconfig -reconfiglevel PGM -present_type SIMPLE \
-change_type CHOICE_LIST -choices_type_name RAPID_TASK_TYPE
-attribute_id Entry -text_id 30,23 -reconfig -reconfiglevel PGM -present_type SIMPLE \
-change_type TEXTVAR -char_length 16
-attribute_id BindRef -text_id 30,41 -reconfig -reconfiglevel PGM -present_type SIMPLE \
-change_type FKBAR -fkbar_id MMC_YN_BOOL_FKBAR
-attribute_id Size -text_id 30,57 -reconfig -reconfiglevel PGM -present_type SIMPLE \
-change_type FKBAR -fkbar_id MMC_TASKSIZE_INC_DEC_FKBAR
SYS_OUTLINE = MMC_OUTLINE:
-Name rapid_tasks_outline -dsp_parms 1,2,4 -header_id 30,27
MMC_TASKSTACK_INC_DEC_FKBAR = MMC_FKEY:
-text_id 30,43 -fktype INC -setcode 1
-text_id 30,44 -fktype DEC -setcode 1
RAPID_TASK_TYPE = MMC_CHOICE:
-text_id 30,24 -setcode NORMAL
-text_id 30,25 -setcode STATIC
-text_id 30,26 -setcode SEMISTATIC

MMC_TASKSIZE_INC_DEC_FKBAR = MMC_FKEY:
-text_id 30,43 -fktype INC -setcode 10000
-text_id 30,44 -fktype DEC -setcode 10000
-text_id 30,58 -fktype SETA -setcode 0
