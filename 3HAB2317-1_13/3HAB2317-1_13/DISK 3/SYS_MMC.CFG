SYS:CFG_1.0::
MMC_TOPICS:
-topic_text_id 30,0 -domain_name SYS -domain_type NA -domain_attribute NA

MMC_TYPE:
-domain_type CAB_REGAIN_DIST -text_id 30,32 -add_f 0 \
-attributes_id REGAIN_DIST_ATTRIBUTE -outline_type SYS_OUTLINE \
-outline_inst_name regain_dist_outline
-domain_type MASTER_BOOL -text_id 30,1  -add_f 1 \
-attributes_id MASTER_BOOL_ATTRIBUTE -outline_type SYS_OUTLINE \
-outline_inst_name master_bool_outline
-domain_type CAB_EXEC_HOOKS -text_id 30,14  -add_f 1 \
-attributes_id RAPID_ROUTIN_ATTRIBUTE -outline_type SYS_OUTLINE \
-outline_inst_name rapid_routin_outline
-domain_type CAB_TASK_MODULES -text_id 30,29 -add_f 1 \
-attributes_id TASK_MODULES_ATTRIBUTE -outline_type SYS_OUTLINE \
-outline_inst_name task_modules_outline
REGAIN_DIST_ATTRIBUTE = MMC_ATTRIBUTE:
-attribute_id Name -text_id 30,33 -reconfig -present_type SIMPLE \
-change_type CHOICE_LIST -choices_type_name REGAIN_DIST_MODE
-attribute_id Tcp_dist -text_id 30,34 -reconfig -present_type SIMPLE \
-change_type FLOAT 
-attribute_id Tcp_rot -text_id 30,35 -reconfig -present_type SIMPLE \
-change_type FLOAT
-attribute_id Ext_dist -text_id 30,36 -reconfig -present_type SIMPLE \
-change_type FLOAT
-attribute_id Ext_rot -text_id 30,37 -reconfig -present_type SIMPLE \
-change_type FLOAT 
MASTER_BOOL_ATTRIBUTE = MMC_ATTRIBUTE:
-attribute_id Name -text_id 30,2 -reconfig -present_type SIMPLE \
-change_type CHOICE_LIST -choices_type_name MMC_MASTER_BOOL_LIST
-attribute_id Select -text_id 30,3 -reconfig -present_type SIMPLE \
-change_type FKBAR -fkbar_id MMC_MASTER_BOOL_FKBAR
RAPID_ROUTIN_ATTRIBUTE = MMC_ATTRIBUTE:
-attribute_id Shelf -text_id 30,16 -reconfig -present_type SIMPLE \
-change_type CHOICE_LIST -choices_type_name RAPID_ROUTIN_EVENTS
-attribute_id Routine -text_id 30,17 -reconfig -present_type SIMPLE \
-change_type TEXTVAR -char_length 16
-attribute_id Task -text_id 30,28 -reconfig -present_type SIMPLE \
-change_type CHOICE_INSTANCE -char_length 16 -choices_type_name CAB_TASKS 
TASK_MODULES_ATTRIBUTE = MMC_ATTRIBUTE:
-attribute_id Task -text_id 30,28 -reconfig -reconfiglevel PGM -present_type SIMPLE \
-change_type CHOICE_INSTANCE -char_length 16 -choices_type_name CAB_TASKS 
-attribute_id File -text_id 30,30 -reconfig -reconfiglevel PGM -present_type SIMPLE \
-change_type TEXT -char_length 80

MMC_MASTER_BOOL_FKBAR = MMC_FKEY:
-text_id 30,4 -fktype SETA -setcode 1
-text_id 30,5 -fktype SETA -setcode 0
SYS_OUTLINE = MMC_OUTLINE:
-Name regain_dist_outline -dsp_parms 1,2,3 -header_id 30,38
-Name master_bool_outline -dsp_parms 1,2 -header_id 30,6
-Name rapid_routin_outline -dsp_parms 1,2,3 -header_id 30,15
-Name task_modules_outline -dsp_parms 1,2 -header_id 30,31
REGAIN_DIST_MODE = MMC_CHOICE:
-text_id 30,39 -setcode MAN
-text_id 30,40 -setcode AUTO
MMC_MASTER_BOOL_LIST = MMC_CHOICE:
-text_id 30,7 -setcode HoldToRun
RAPID_ROUTIN_EVENTS = MMC_CHOICE:
-text_id 30,8 -setcode POWER_ON
-text_id 30,9 -setcode START
-text_id 30,10 -setcode STOP
-text_id 30,11 -setcode QSTOP
-text_id 30,12 -setcode RESTART
-text_id 30,13 -setcode RESET
