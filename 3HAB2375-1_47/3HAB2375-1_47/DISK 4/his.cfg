MMC:CFG_1.0::
TP_CLIENTS = AUTH_CLIENTS:
-name his -permission HIS_PERMISSION
HIS_PERMISSION = AUTH_CLIENT_PERMISSION:
-name RESTORE -text_id 8,164 -userlevel PROGRAMMER -confirm YES
MMC_TYPE:
-domain_type HIS_PERMISSION -text_id 8,163 \
-attributes_id HIS_MMC_ATTRIBUTES \
-outline_type HIS_MMC_OUTLINE -outline_inst_name mmc_his_outline
HIS_MMC_ATTRIBUTES = MMC_ATTRIBUTE:
-attribute_id name -text_id 1,84 -present_type SIMPLE_TEXT_ID \
-change_type NONE

-attribute_id userlevel -text_id 1,85 -present_type SIMPLE \
-change_type CHOICE_LIST -choices_type_name MMC_USER_LEVELS

-attribute_id confirm -text_id 1,86 -present_type SIMPLE \
-change_type CHOICE_LIST -choices_type_name MMC_CONFIRM
HIS_MMC_OUTLINE = MMC_OUTLINE:
-Name mmc_his_outline -dsp_parms 1,2,3 -header_id 1,87
