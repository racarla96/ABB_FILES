MMC:CFG_1.0::

MMC_REAL_ROUTINE:

-name searchc -default_struct 1,1,0,1,1,1,1,0,1,0,0
-name searchl -default_struct 1,1,0,1,1,1,0,1,0,0

MMC_REAL_PARAM:

-name searchc_speed       -name_rule LAST -def_name v100
-name searchc_v           -name_rule LAST -def_name 100
-name searchc_t           -name_rule DEF  -def_name 5
-name searchc_tool        -name_rule CUR  -method hirule_tooldata
-name searchc_wobj        -name_rule CUR  -method hirule_wobjdata

-name searchl_speed       -name_rule LAST -def_name v100
-name searchl_v           -name_rule LAST -def_name 100
-name searchl_t           -name_rule DEF  -def_name 5
-name searchl_tool        -name_rule CUR  -method hirule_tooldata
-name searchl_wobj        -name_rule CUR  -method hirule_wobjdata


MMC_COMMON_PARAM:

-name searchc_cirpoint 	-common_space_name common_point
-name searchc_topoint 	-common_space_name common_point
-name searchl_topoint 	-common_space_name common_point


MMC_INSTR_WITH_WOBJ:

-name searchc	-param_nr 10
-name searchl	-param_nr 9

MMC_SELECT_PARAM:

-name searchc	-param_nr 6


MMC_NO_PC_MOVEMENT:

-name searchc_cirpoint


MMC_NO_MODPOS:

-name searchc_searchpoint
-name searchl_searchpoint


MMC_NO_NOREGAIN:

-name searchc


MMC_REAL_DATATYPE:


		  
		  
		  
