MMC:CFG_1.0::
MMC_DATATYPE_GROUP:
-name Condition -type MMC_CONDITION
-name TEST -type MMC_TEST
-name Assignment -type MMC_ASSIGNMENT
MMC_CONDITION = MMC_DATATYPE:
-name num -info e.g. reg1<5
-name signaldi -info e.g. di1=1
-name bool -info e.g. flag1=TRUE
-name ...    -info ...
MMC_TEST = MMC_DATATYPE:
-name num -info e.g. reg1
-name bool -info e.g. flag1
-name robtarget -info e.g. p1
-name ...     -info ...
MMC_ASSIGNMENT = MMC_DATATYPE:
-name num -info e.g. reg1:=5
-name bool -info e.g. flag1:=TRUE
-name robtarget -info e.g. p1:=p4
-name ...     -info ...
