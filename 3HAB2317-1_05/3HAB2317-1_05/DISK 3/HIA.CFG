MMC:CFG_1.0::
TP_CLIENTS = AUTH_CLIENTS:
-name hiats -permission HIA_PERMISSION
HIA_PERMISSION = AUTH_CLIENT_PERMISSION:
-name LAUNCH -text_id 1,7 -userlevel OPERATOR
-name EDIT_PROGRAM -text_id 3,375 -userlevel OPERATOR -confirm NO
-name DELETE_INSTRUCTION -text_id 3,308 -userlevel OPERATOR -confirm YES
-name DELETE_OBJECT -text_id 3,309 -userlevel OPERATOR -confirm YES
-name CONFIRM_START_FROM_CURSOR -text_id 3,313 -userlevel OPERATOR -confirm YES

MMC_HIA_MODPOS:         
-name modpos -type -limittrans 5 -limitrot 10 \
-limitexttrans 50 -limitextrot 10

MMC_TYPE:
-domain_type HIA_PERMISSION -text_id 3,307 \
-attributes_id HIA_MMC_ATTRIBUTES \
-outline_type MMC_OUTLINE -outline_inst_name mmc_hia_outline
-domain_type MMC_HIA_MODPOS -text_id 3,353  -add_f 0 \ 
-attributes_id "" -attributes_id_hook hia_modpos_cfg_hook\
-outline_type MMC_OUTLINE -outline_inst_name modpos_outline
MMC_OUTLINE:
-Name mmc_hia_outline -dsp_parms 1,2,3 -header_id 1,87
-Name modpos_outline -dsp_parms 1 -header_id 3,354

HIA_MMC_ATTRIBUTES = MMC_ATTRIBUTE:
-attribute_id name -text_id 1,84 -present_type SIMPLE_TEXT_ID \
-change_type NONE

-attribute_id userlevel -text_id 1,85 -present_type SIMPLE \
-change_type CHOICE_LIST -choices_type_name MMC_USER_LEVELS

-attribute_id confirm -text_id 1,86 -present_type SIMPLE \
-change_type CHOICE_LIST -choices_type_name MMC_CONFIRM

MMC_HIA_MODPOS_1_ATTRIBUTE = MMC_ATTRIBUTE:
-attribute_id type  -text_id 3,354 -present_type SIMPLE \
-change_type FKBAR -fkbar_id MMC_MODPOS_TYPE_FKBAR
-attribute_id mode  -text_id 3,363 -present_type SIMPLE \
-change_type FKBAR -fkbar_id MMC_MODPOS_MODE_FKBAR
-attribute_id limittrans  -text_id 3,359 -present_type SIMPLE \
-change_type FLOAT
-attribute_id limitrot  -text_id 3,360 -present_type SIMPLE \
-change_type FLOAT
-attribute_id limitexttrans  -text_id 3,361 -present_type SIMPLE \
-change_type FLOAT
-attribute_id limitextrot  -text_id 3,362 -present_type SIMPLE \
-change_type FLOAT  
MMC_HIA_MODPOS_2_ATTRIBUTE = MMC_ATTRIBUTE:
-attribute_id type  -text_id 3,354 -present_type SIMPLE \
-change_type FKBAR -fkbar_id MMC_MODPOS_TYPE_FKBAR
-attribute_id ifauto  -text_id 3,379 -present_type SIMPLE \
-change_type FKBAR -fkbar_id MMC_MODPOS_IFAUTO_FKBAR

MMC_MODPOS_TYPE_FKBAR = MMC_FKEY:
-text_id 3,357 -fktype SETA -setcode 1
-text_id 3,358 -fktype SETA -setcode 0
MMC_MODPOS_MODE_FKBAR = MMC_FKEY:
-text_id 3,364 -fktype SETA -setcode 1
-text_id 3,365 -fktype SETA -setcode 0
MMC_MODPOS_IFAUTO_FKBAR = MMC_FKEY:
-text_id 3,381 -fktype SETA -setcode 1
-text_id 3,382 -fktype SETA -setcode 0
