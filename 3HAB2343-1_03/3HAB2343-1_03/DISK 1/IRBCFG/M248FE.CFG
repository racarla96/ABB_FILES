# MOTION_SYSTEM - ?
MOTION_SYSTEM:
#
-name "system_1" -version "1.1" -brake_on_timeout 3600000 \
-dynamic_resolution 1 -path_resolution 1.3 -min_servo_queue_time 0.048384 \
-std_servo_queue_time 0.193536 -max_servo_queue_time 0.193536 \
-min_servo_queue_length 2 -std_servo_queue_length 8 -max_servo_queue_length 8 \
