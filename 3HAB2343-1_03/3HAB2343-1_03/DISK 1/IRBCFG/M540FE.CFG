# MOTION_SYSTEM - ?
MOTION_SYSTEM:
#
-name "system_1" -version "1.1" -brake_on_timeout 3600000 \
-dynamic_resolution 1 -path_resolution 1 -min_servo_queue_time 0.048384 \
-std_servo_queue_time 0.12096 -max_servo_queue_time 0.193536 \
-min_servo_queue_length 2 -std_servo_queue_length 5 -max_servo_queue_length 8 \
-min_temp_ambient_cabinet 5 -max_temp_ambient_cabinet 45 \
-min_temp_ambient_robot 5 -max_temp_ambient_robot 45 \
-perpendicular_acc_ratio 1 -micro_ipol_type 0 

# RELAY - ?
RELAY:
#
-name "irb_brake" -out_signal "BRAKEREL" -in_signal "" -inverted_input \
-delay_time 0.2 -probe_point_sub_id 1 
#
-name "irb_run" -out_signal "RUN_CTRL" -in_signal "RUNOK_N" -inverted_input \
-delay_time 0.2 -probe_point_sub_id 2 
#
-name "irb_fault" -out_signal "FAULT_N" -in_signal "" -inverted_input \
-delay_time 0.2 -probe_point_sub_id 3 

