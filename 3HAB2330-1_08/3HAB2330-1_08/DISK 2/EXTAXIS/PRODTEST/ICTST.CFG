MOC:CFG_1.0::

# MOC_EXT_ICTST.cfg
# ICTST
# Product Test IC Axis 7
# created 1997/03/13 17:40:27 by param_db $Revision: 1.5 $


# MECHANICAL_UNIT - ?
MECHANICAL_UNIT:
#
-name "ICTST" -use_run_enable "" -use_activation_relay "" -use_brake_relay "" \
-use_single_0 "ICTST" -user_frame_moved_by "" 

# SINGLE - ?
SINGLE:
#
-name "ICTST" -use_single_type "ICTST" -use_joint "ICTST" -base_frame_pos_x 0 \
-base_frame_pos_y 0 -base_frame_pos_z 0 -base_frame_orient_u0 1 \
-base_frame_orient_u1 0 -base_frame_orient_u2 0 -base_frame_orient_u3 0 

# SINGLE_TYPE - ?
SINGLE_TYPE:
#
-name "ICTST" -mechanics "FREE_ROT" 

# JOINT - ?
JOINT:
#
-name "ICTST" -logical_axis 7 -use_axc_channel "ICTST" -use_arm "ICTST" \
-use_brake "ICTST" -use_supervision "ICTST" -use_axc_filter "ICTST" \
-use_drive_system "ICTST" -uncalibrated_control_master_type "UCCM0" \
-use_uncalibrated_control_master "ICTST" -normal_control_master_type "LCM0" \
-use_normal_control_master "ICTST" 

# AXC_CHANNEL - ?
AXC_CHANNEL:
#
-name "ICTST" -channel 7 -measurement_type 1 

# ARM - ?
ARM:
#
-name "ICTST" -use_arm_type "ICTST" -rotating_move -transm_joint 150 \
-upper_joint_bound 3.141593 -lower_joint_bound -3.141593 \
-upper_joint_bound_max 3.141593 -lower_joint_bound_min -3.141593 -wc_acc 250 \
-wc_dec 250 

# ARM_TYPE - Type of arm
ARM_TYPE:
#
-name "ICTST" 

# BRAKE - ?
BRAKE:
#
-name "ICTST" -control_off_speed_limit 1 -control_off_delay_time 0.01 \
-brake_control_on_delay_time 0.01 -brake_torque 0.05 \
-brake_ramp_speed_limit 0.4 

# SUPERVISION - (all parameters on motor side)
SUPERVISION:
#
-name "ICTST" -use_supervision_type "ICTST" -power_up_position_on \
-counter_supervision_on -position_supervision_on -speed_supervision_on \
-load_supervision_on -jam_supervision_on -in_position_range 1 \
-normalized_zero_speed 0.02 

# SUPERVISION_TYPE - Supervision type (all parameters motor side)
SUPERVISION_TYPE:
#
-name "ICTST" -static_power_up_position_limit 3 \
-dynamic_power_up_position_limit 150 -static_position_limit 3 \
-dynamic_position_limit 200 -static_normalized_speed_limit 0.06 \
-dynamic_normalized_speed_limit 0.3 -normalized_influence_sensitivity 0 \
-speed_half_time 0.5 -max_jam_normalized_speed 0.05 -max_overload_time 0.5 \
-max_jam_time 0.5 -teach_mode_speed_max_main 0.15 \
-teach_normalized_low_speed 0.25 -teach_mode_speed_max_dsp 0.28 

# AXC_FILTER - ?
AXC_FILTER:
#
-name "ICTST" -b0_0 0.5 -b1_0 0.5 -a1_1 0.903473 -b0_1 0.256261 \
-b1_1 -0.159734 -b0_2 1 

# DRIVE_SYSTEM - ?
DRIVE_SYSTEM:
#
-name "ICTST" -use_mains "mains" -use_trafo "trafo" -use_dc_link "dc_link" \
-use_drive_unit "ICTST" -use_current_transfer_function "normal" \
-use_cable "cable_1" -use_motor "ICTST" -use_thermal_duty_cycle "ICTST" \
-use_stress_duty_cycle "ICTST" 

# DRIVE_UNIT - ?
DRIVE_UNIT:
#
-name "ICTST" -use_drive_unit_type "DSQC_236C" 

# MOTOR - ?
MOTOR:
#
-name "ICTST" -use_motor_type "ICTST" -com_offset 1.570796 -valid_com_offset \
-cal_offset 0 -valid_cal_offset 

# MOTOR_TYPE - ?
MOTOR_TYPE:
#
-name "ICTST" -pole_pairs 3 -ke 0.485 -i_max 12.1 

# THERMAL_DUTY_CYCLE - ?
THERMAL_DUTY_CYCLE:
#
-name "ICTST" 

# STRESS_DUTY_CYCLE - ?
STRESS_DUTY_CYCLE:
#
-name "ICTST" -speed_absolute_max 109.96 -torque_absolute_max 3.92 

# UCCM0 - ?
UCCM0:
#
-name "ICTST" -Kp 10 -Kv 0.075 -Ti 0.05 -Kp_stability 15 -speed_max_n 57.6 \
-acc_max_n 264 -dec_max_n 314 

# LCM0 - ?
LCM0:
#
-name "ICTST" -Kp 10 -Kv 0.075 -Ti 0.05 
