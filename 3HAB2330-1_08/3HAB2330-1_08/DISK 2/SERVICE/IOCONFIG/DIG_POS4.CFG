EIO:CFG_1.0::
# ELEMENTARY IO : DEFINITION & CONFIGURATION
# 
EIO_UNIT:
# Configured EIO-Units for the robotsystem 
# Configuration parameters:
# -Name		Symbolic Name for EIO-Unit		Mandatory
# -Type		Type of EIO-Unit			Mandatory
# -Bus		System Bus for EIO-Unit			Mandatory
# -Address	Address for EIO-Unit on system bus	Mandatory
# -Enabled	Unit is enabled or disabled(TRUE/FALSE)	Optional
# -Digin	Number of defined digital in-signals	Optional
# -Digout	Number of defined digital out-signals	Optional
# -Anin		Number of defined analog in-signals	Optional
# -Anout	Number of defined analog out-signals	Optional
# -Filterin	Filter time for digital in-signals	Optional
# -Poll		Poll time for in-signals		Optional
# 
-Name  BOARD4 -Type d223 -Bus BAS -Address 0x4 -Digin 16 -Digout 16
#
# EIO_SIGNAL:
# Configured EIO-Signals for the robotsystem
# Configuration parameters:
# -Name		Symbolic Name for the EIO-Signal		Mandatory
# -Type		Type of EIO-Signal (DO/DI/AO/AI)		Mandatory
# -Unit		EIO-Unit for the signal				Mandatory
# -Phsig	Physical Signal number on unit			Mandatory
# -Enabled 	Signal enabled or disabled (TRUE/FALSE)		Optional
# -Max		Max in/out value				Optional
# -Min		Min in/out value				Optional
# -Nobits	Number of bits for resolution			Optional
# -Acthigh	In-signal activation level = high (TRUE/FALSE)	Optional
# -Invert	Invert of out-signal (TRUE/FALSE)		Optional
# -Pfailout	Restart value after powerfail			Optional
# -Xname	Crossconnection 				Optional
#
#
EIO_USER_SIGNAL = EIO_SIGNAL:
