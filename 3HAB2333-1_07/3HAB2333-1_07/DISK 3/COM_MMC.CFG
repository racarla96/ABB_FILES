SIO:CFG_1.0::
MMC_TOPICS:
-topic_text_id 80,0 -domain_name SIO -domain_type NA -domain_attribute NA

MMC_TYPE:
-domain_type COM_PHY_CHANNEL -text_id 80,31  -reconfig -add_f 1 \ 
-attributes_id MMC_PHY_ATTRIBUTE -outline_type MMC_SIG_OUTLINE \
-outline_inst_name comphy_outline
-domain_type COM_TRP -text_id 80,32 -reconfig -add_f 1 \
-attributes_id MMC_TRP_ATTRIBUTE -outline_type MMC_SIG_OUTLINE \
-outline_inst_name comtrp_outline
-domain_type COM_APP -text_id 80,33 -reconfig -add_f 1 \
-attributes_id MMC_APP_ATTRIBUTE -outline_type MMC_SIG_OUTLINE \
-outline_inst_name comapp_outline

MMC_PHY_ATTRIBUTE = MMC_ATTRIBUTE:
-attribute_id Name   -text_id 80,2  -present_type SIMPLE \
-change_type TEXT -char_length 16 -reconfig
-attribute_id Type -text_id 80,34  -present_type SIMPLE \
-change_type CHOICE_INSTANCE -choices_type_name COM_PHY_CHANNEL_TYPE \
-reconfig
-attribute_id Channel -text_id 80,30  -present_type SIMPLE \
-change_type INTEGER -reconfig
-attribute_id Baudrate  -text_id 80,3  -present_type SIMPLE \
-change_type CHOICE_LIST -choices_type_name MMC_SIO_BAUD \
-reconfig
-attribute_id Parity -text_id 80,4  -present_type SIMPLE \
-change_type CHOICE_LIST -choices_type_name MMC_SIO_PARITY \
-reconfig
-attribute_id NoOfBits  -text_id 80,5  -present_type SIMPLE \
-change_type FKBAR  -fkbar_id MMC_SIO_BITS -reconfig
-attribute_id NoOfStopBits -text_id 80,6  -present_type SIMPLE \
-change_type FKBAR  -fkbar_id MMC_SIO_STOP -reconfig
-attribute_id RTS/CTSControl -text_id 80,46  -present_type SIMPLE \
-change_type FKBAR  -fkbar_id MMC_SIO_RTSCTS -reconfig

MMC_TRP_ATTRIBUTE = MMC_ATTRIBUTE:
-attribute_id Name -text_id 80,2  -present_type SIMPLE \
-change_type TEXT -char_length 16 -reconfig
-attribute_id Type -text_id 80,34  -present_type SIMPLE \
-change_type CHOICE_INSTANCE -choices_type_name COM_TRP_TYPE \
-reconfig
-attribute_id PhyChannel -text_id 80,35  -present_type SIMPLE \
-change_type CHOICE_INSTANCE -choices_type_name COM_PHY_CHANNEL \
-reconfig
-attribute_id LocalAdress  -text_id 80,8  -present_type SIMPLE \
-change_type TEXT -char_length 16 -reconfig 
-attribute_id RemoteAdress  -text_id 80,9  -present_type SIMPLE \
-change_type TEXT -char_length 16 -reconfig 
-attribute_id PortNo  -text_id 80,36  -present_type SIMPLE \
-change_type INTEGER -reconfig 

MMC_APP_ATTRIBUTE = MMC_ATTRIBUTE:
-attribute_id Name -text_id 80,2  -present_type SIMPLE \
-change_type TEXT -char_length 16 -reconfig
-attribute_id Type -text_id 80,34  -present_type SIMPLE \
-change_type CHOICE_INSTANCE -choices_type_name COM_APP_TYPE \
-reconfig
-attribute_id Trp -text_id 80,40  -present_type SIMPLE \
-change_type CHOICE_INSTANCE -choices_type_name COM_TRP \
-reconfig
-attribute_id SpSysEvent -text_id 80,41  -present_type SIMPLE \
-change_type FKBAR -fkbar_id MMC_SIO_SPON \
-reconfig
-attribute_id EnableSUBSCW -text_id 80,47  -present_type SIMPLE \
-change_type FKBAR -fkbar_id MMC_SIO_SPON \
-reconfig
MMC_SIG_OUTLINE = MMC_OUTLINE:
-Name comphy_outline   -dsp_parms 1,2,3 -header_id 80,37
-Name comtrp_outline   -dsp_parms 1,2,3 -header_id 80,38
-Name comapp_outline   -dsp_parms 1,2,3 -header_id 80,39 
MMC_SIO_BITS = MMC_FKEY:
-text_id 80,10 -fktype SETA -setcode "7"
-text_id 80,11 -fktype SETA -setcode "8"
MMC_SIO_STOP = MMC_FKEY:
-text_id 80,12 -fktype SETA -setcode "1"
-text_id 80,13 -fktype SETA -setcode "2"
MMC_SIO_BAUD = MMC_CHOICE:
-text_id 80,17 -setcode 300
-text_id 80,18 -setcode 600
-text_id 80,19 -setcode 1200
-text_id 80,20 -setcode 2400
-text_id 80,21 -setcode 4800
-text_id 80,22 -setcode 9600
-text_id 80,23 -setcode 19200

MMC_SIO_PARITY = MMC_CHOICE:
-text_id 80,25 -setcode none
-text_id 80,26 -setcode odd
-text_id 80,27 -setcode even

MMC_SIO_SPON = MMC_FKEY:
-text_id 80,42 -fktype SETA -setcode "1"
-text_id 80,43 -fktype SETA -setcode "0"

MMC_SIO_RTSCTS = MMC_FKEY:
-text_id 80,44 -fktype SETA -setcode "on"
-text_id 80,45 -fktype SETA -setcode "off"
