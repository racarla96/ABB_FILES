-name tpreadnum  -default_struct 1,1,0,0
-name tpwrite    -default_struct 1,0
-name write      -default_struct 1,1,0,0

MMC_REAL_PARAM:

-name common_iodevice	-name_rule LAST

-name open_object       -name_rule LAST  -def_name """flp1:"""
-name open_file         -name_rule LAST  -def_name """"""

-name tpreadfk_answer   -name_rule LAST
-name tpreadfk_text     -name_rule DEF   -def_name """"""
-name tpreadfk_fk1      -name_rule DEF   -def_name """"""
-name tpreadfk_fk2      -name_rule DEF   -def_name """"""
-name tpreadfk_fk3      -name_rule DEF   -def_name """"""
-name tpreadfk_fk4      -name_rule DEF   -def_name """"""
-name tpreadfk_fk5      -name_rule DEF   -def_name """"""
-name tpreadfk_maxtime  -name_rule LAST  -def_name 60
-name tpreadfk_dibreak  -name_rule LAST

-name tpreadnum_answer  -name_rule LAST
-name tpreadnum_string  -name_rule DEF   -def_name """"""
