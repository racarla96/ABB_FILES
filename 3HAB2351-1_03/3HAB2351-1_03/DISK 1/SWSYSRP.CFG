SYS:CFG_1.0::
# CAB : DEFINITION & CONFIGURATION for SpotWare1
# $Revision: 1.3 $
#
CAB_TASKS:
# Set up some setings for each task intance
#-Name            The symbolic name of this task               Mandatory
#-Prog		  Program instance                             Mandatory
#-Task_in_forground  Task in foreground 
#                                                              Optional ("" (top level))
#-Type		  Program type. One of NORMAL,STATIC, SEMISTATIC
#					      		       Optional (SEMISTATIC)
#-Entry           Name of the main routine                     Mandatory (main)
-Name MAIN -Prog 0 -Type NORMAL -RewERIfStop 1

CAB_REGAIN_DIST:
# Set up maximum distance from the path that will cause a regain movement
# in MAN mode without user interference
#-Tcp_dist       The tcp distance			  Optional (0.1 100mm)
#-Tcp_rot        The tcp rotation in rad		  Optional (1.57 PI/2)
#-Ext_dist       The distance for external axes		  Optional (0.1 100mm)
#-Ext_rot        The rotation for external axes		  Optional (1.57 PI/2)
-Name MAN -Tcp_dist 0.05 -Tcp_rot 0.2 -Ext_dist 0.05 -Ext_rot 0.2
-Name AUTO -Tcp_dist 0.5 -Tcp_rot 1.57 -Ext_dist 0.5 -Ext_rot 1.57

CAB_EXEC_HOOKS:
# Init and other set/reset hooks
#-Routine        Name of ARL routine             Mandatory
#-Shelf 	 Place in the execution          Mandatory
#                   POWER_ON
#                   START
#                   STOP
#                   QSTOP
#                   RESTART
#                   RESET
#-Task		 Program instance Name or number   Mandatory
-Routine SYS_RESET  -Shelf RESET -Task 0
-Routine sh_power_on  -Shelf POWER_ON -Task 0
-Routine sh_start  -Shelf START -Task 0
-Routine sh_restart  -Shelf RESTART -Task 0
-Routine sh_stop  -Shelf STOP -Task 0
-Routine sh_qstop  -Shelf QSTOP -Task 0
-Routine sh_mode_switch  -Shelf MODE_SWITCH -Task 0
#
CAB_TASK_MODULES:
# Load system module
#-File           Path to the system module or a normal module   Mandatory
#-Task		 Program instance        Name or number		Mandatory
#-??Modname	 Module name (only significant for system 
#                             modules)   Name 	   (as filname) Optional
-File ram1disk:base.sys -Task 0 
-File ram1disk:user.sys -Task 0
-File ram1disk:swtext.sys -Task 0 
-File ram1disk:swuser.sys -Task 0
-File ram1disk:swbase.sys -Task 0 
-File ram1disk:swtimer.sys -Task 0





