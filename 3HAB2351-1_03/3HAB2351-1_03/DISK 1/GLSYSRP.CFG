SYS:CFG_1.0::
# CAB : DEFINITION & CONFIGURATION for SpotWare1
# $Revision: 1.3 $
#
CAB_EXEC_HOOKS:
# Init and other set/reset hooks
#-Routine        Name of ARL routine             Mandatory
#-Shelf          Place in the execution          Mandatory
#                   POWER_ON
#                   START
#                   STOP
#                   QSTOP
#                   RESTART
#                   RESET
#-Task           Program instance Name or number   Mandatory
-Routine glb_power_on -Shelf POWER_ON -Task 0
-Routine glb_start    -Shelf START    -Task 0
-Routine glb_restart  -Shelf RESTART  -Task 0
-Routine glb_stop     -Shelf STOP     -Task 0
-Routine glb_qstop    -Shelf QSTOP    -Task 0
-Routine glb_mode_switch  -Shelf MODE_SWITCH -Task 0
#
CAB_TASK_MODULES:
# Load system module
#-File           Path to the system module or a normal module   Mandatory
#-Task           Program instance        Name or number         Mandatory
#-??Modname      Module name (only significant for system 
#                             modules)   Name      (as filname) Optional
-File ram1disk:gluser.sys -Task 0
-File ram1disk:glbase.sys -Task 0
-File ram1disk:gltext.sys -Task 0





