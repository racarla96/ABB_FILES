-Name tip1_retract -Unit SW_BOARD -Type DI -Phsig 6  -Length 1
-Name weld_ready1 -Unit SW_BOARD -Type DI -Phsig 7  -Length 1
-Name timer_ready -Unit SW_BOARD -Type DI -Phsig 8 -Length 1
-Name flow_ok -Unit SW_BOARD -Type DI -Phsig 9 -Length 1
-Name temp_ok -Unit SW_BOARD -Type DI -Phsig 10 -Length 1
-Name current_ok -Unit SW_BOARD -Type DI -Phsig 11 -Length 1
-Name di12 -Unit SW_BOARD -Type DI -Phsig 12 -Length 1
-Name di13 -Unit SW_BOARD -Type DI -Phsig 13 -Length 1
-Name di14 -Unit SW_BOARD -Type DI -Phsig 14 -Length 1
-Name di15 -Unit SW_BOARD -Type DI -Phsig 15 -Length 1
-Name di16 -Unit SW_BOARD -Type DI -Phsig 16 -Length 1
-Name reset_fault -Unit SW_BOARD -Type DO -Phsig 1  -Length 1
-Name p2_req -Unit SW_BOARD -Type DO -Phsig 2  -Length 1
-Name p3_req -Unit SW_BOARD -Type DO -Phsig 3  -Length 1
-Name p4_req -Unit SW_BOARD -Type DO -Phsig 4  -Length 1
-Name close_tip1 -Unit SW_BOARD -Type DO -Phsig 5  -Length 1
-Name work_select -Unit SW_BOARD -Type DO -Phsig 6  -Length 1 -Store
-Name start1 -Unit SW_BOARD -Type DO -Phsig 7  -Length 1
-Name current_enable -Unit SW_BOARD -Type DO -Phsig 8 -Length 1 -Store
-Name process_error -Unit SW_BOARD -Type DO -Phsig 9 -Length 1 -Store
-Name prog_parity -Unit SW_BOARD -Type DO -Phsig 10 -Length 1 -Store
-Name prog_sig1 -Unit SW_BOARD -Type DO -Phsig 11 -Length 1
-Name prog_sig2 -Unit SW_BOARD -Type DO -Phsig 12 -Length 1
