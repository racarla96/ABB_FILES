EIO_CROSS:
# Cross connections:
# 
EIO_GROUP_PHS = EIO_SIGNAL:
# Configured EIO-Groups of signals for the robotsystem
# Configuration parameters:
# -Name		Symbolic Name for the EIO-Group			Mandatory
# -Type		Type of EIO-Group(GI/GO)			Mandatory
# -Unit		EIO-Unit for the group				Mandatory
# -Phsig	Physical Signal number on unit for grp-start	Mandatory		
# -Length 	Length of group					Mandatory
# -Enabled 	Group enabled or disabled (TRUE/FALSE)		Optional
#
-Name pressure_group -Unit SW_BOARD -Type GO -Phsig 2 -Length 3 -Store
-Name prog_no_group -Unit SW_BOARD -Type GO -Phsig 11 -Length 6 -Store
#
SYSSIG_OUT:
# Current outconfiguration (SystemStatus to digital out): type for Elog status
# Configuration parameters:
# -Status	Symbolic Name for the Elog status		Mandatory
# -Signal	Symbolic Name for the Eio-outsignal		Mandatory
#
#-Status PExecErr -Signal DO_007
#-Status TCPSpeed -Signal AO_001
#
#
SYSSIG_IN:
