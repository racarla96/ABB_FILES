SYS:CFG_1.0::
# Installation of ReaL packet for option 581 Advanced Functions
# Configuration file /rlall/rladv.cfg
# $Revision: 1.2 $


CAB_REAL_PACKETS:
# Load real packet
#-Packet         Name of handle to the ReaL-packet or           Mandatory
#                if the Generator field below is set, the
#                name of the system (inparamter to the
#                Generator)
#-Generator      Name of a generator (code) that produce a      Optional
#                handle to the ReaL-packet.                      
#-Text 	         Text resource id for the ReaL-packet		Mandatory
#                (see tx.h)
#-Task		 The name or instance no of the task.  		Mandatory
#                If the task name OTHERS is used, then all
#                tasks without any other specification will
#                get this packet.
#                Always use instance no 0 for the main task in this file


-Packet rlmset_opt1_sym		-Text 58 -Task 0
-Packet rlcom_opt1_sym 		-Text 55 -Task 0
-Packet rlcom_opt1_sym	 	-Text 55 -Task OTHERS
-Packet rltrig_opt1_sym 	-Text 74 -Task 0

